<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/styles.css">
    <title>Mini Projects</title>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col text-center">
                <h1>Title</h1>
            </div>
        </div>
        <div class="row">
            <div class="col-6">
                <div class="card">
                    <div class="card-header tip">
                        <h3>Tip Calculator</h3>
                    </div>
                    <div class="card-body">
                    <!--Inputs-->

                    <div class="mb-3">
                        <label for="input1" class="form-label">Subtotal ($)</label>
                        <input type="text" class="form-control" id="input1" placeholder="Type here">
                    </div>
                    <div class="mb-3">
                        <label for="input2" class="form-label">Tip Percentage (as decimal, e.g. 0.2)</label>
                        <input type="text" class="form-control" id="input2" placeholder="Type here">
                    </div>
                        <button type="button" class="btn btn-primary tip" id="btn1">Calculate Tip</button>
                    </div>   
                    <div class="card-footer text-body-secondary">
                        <p>Tip Amount: <span id="tipOutput">--</span></p>
                        <p>Total Bill: <span id="totalOutput">--</span></p>
                    </div>
                </div>
            </div>

<!--Test-->

<div class="col-6">
                <div class="card">
                    <div class="card-header pay">
                        <h3>Paycheck Calculator</h3>
                    </div>
                    <div class="card-body">
                    <!--Inputs-->

                    <div class="mb-3">
                        <label for="formGroupExampleInput3" class="form-label">Hours Worked</label>
                        <input type="text" class="form-control" id="formGroupExampleInput3" placeholder="Type here">
                    </div>
                    <div class="mb-3">
                        <label for="formGroupExampleInput4" class="form-label">Hourly Rate ($)</label>
                        <input type="text" class="form-control" id="formGroupExampleInput4" placeholder="Type here">
                    </div>
                        <button type="button" class="btn btn-primary pay" id="btn2">Calculate Paycheck</button>
                    </div>   
                    <div class="card-footer text-body-secondary">
                        <p>Paycheck Amount: <span id="paycheckOutput">--</span></p> 
                    </div>
                </div>
            </div>
</div>

        <div class="row">
            <div class="col-6">
                <div class="card">
                    <div class="card-header grade">
                        <h3>Grade Calculator</h3>
                    </div>
                    <div class="card-body">
                    <!--Inputs-->

                    <div class="mb-3">
                        <label for="formGroupExampleInput5" class="form-label">Points Earned</label>
                        <input type="text" class="form-control" id="formGroupExampleInput5" placeholder="Type here">
                    </div>
                    <div class="mb-3">
                        <label for="formGroupExampleInput6" class="form-label">Total Points</label>
                        <input type="text" class="form-control" id="formGroupExampleInput6" placeholder="Type here">
                    </div>
                        <button type="button" class="btn btn-primary grade" id="btn3">Calculate Grade</button>
                    </div>   
                    <div class="card-footer text-body-secondary">
                        <p>Your Grade: <span id="gradeOutput">--</span></p>
                    </div>
                </div>
            </div>

            <div class="col-6">
                <div class="card">
                    <div class="card-header gas">
                        <h3>Gas Cost Calculator</h3>
                    </div>
                    <div class="card-body">
                    <!--Inputs-->

                    <div class="mb-3">
                        <label for="formGroupExampleInput" class="form-label">Tank Size (gallons)</label>
                        <input type="text" class="form-control" id="formGroupExampleInput7" placeholder="Type here">
                    </div>
                    <div class="mb-3">
                        <label for="formGroupExampleInput8" class="form-label">Price per Gallon ($)</label>
                        <input type="text" class="form-control" id="formGroupExampleInput8" placeholder="Type here">
                    </div>
                        <button type="button" class="btn btn-primary gas" id="btn4">Calculate Gas Cost</button>
                    </div>   
                    <div class="card-footer text-body-secondary">
                        <p>Cost to Fill Up: <span id="gasOutput">--</span></p>
                    </div>
                </div>
            </div>
        </div>





    </div>



     <script src="js/script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
</body>
</html>
